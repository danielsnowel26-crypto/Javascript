<!DOCTYPE html>
<html lang="en" class="register-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>Nexora</h1>
    <h2>Create Your Account</h2>
    <p>Join Nexora and Start Exploring</p>

    <form>
        <label for="name">Full Name</label>
        <input type="text"
        id="name"
        placeholder="Please Enter Your Name">

        <label for="mail">Email</label>
        <input type="email"
        id="mail"
        placeholder="Enter a vaild email address">

        <label for="phone">Phone</label>
        <input type="tel"
        id="phone"
        placeholder="Input Your Number">

         <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter Your Password"
          required
        />

         <label for="confirm">Confirm Password</label>
        <input
          type="password"
          id="confirm"
          placeholder="Re-Enter Your Password"
          required
        />

        <button class="signbtn">Sign Up</button>
        <p class="login">Already Have An Account ? <a href="login.html">Login</a></p>
    </form>
</body>
</html>
