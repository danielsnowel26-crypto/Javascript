<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cal</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div class="cal">
        <div class="dis">
            <div class="abc">12 + 7</div>
            <div class="def">19</div>
        </div>

        <div class="btns">
            <button class="btn clearbtn">C</button>
            <button class="btn delbtn">&#9003;</button>
            <button class="btn operatorbtn">%</button>
            <button class="btn operatorbtn">&</button>

            <button class="btn numbtn">7</button>
            <button class="btn numbtn">8</button>
            <button class="btn numbtn">9</button>
            <button class="btn operatorbtn">&times;</button>

            <button class="btn numbtn">4</button>
            <button class="btn numbtn">5</button>
            <button class="btn numbtn">6</button>
            <button class="btn operatorbtn">&minus;</button>

             <button class="btn numbtn">1</button> 
            <button class="btn numbtn">2</button>
            <button class="btn numbtn">3</button>
            <button class="btn operatorbtn">+</button>

             <button class="btn numbtn">0</button>
             <button class="btn numbtn">.</button>
            <button class="btn numbtn">,</button>
            <button class="btn equalbtn">=</button>
        </div>
    </div>
</body>
</html>
