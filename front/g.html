<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Tracker</title>
  <link rel="stylesheet" href="g.css">
</head>
<body>
  <div class="container">
    <h2>Student Grade Tracker</h2>

    <!-- INPUT SECTION -->
    <div id="inputSection">
      <div class="input-group">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="Enter student's name">
        <div class="error" id="nameError">Please enter a valid name</div>
      </div>

      <div class="input-group">
        <label for="numSubjects">Number of Subjects</label>
        <input type="number" id="numSubjects" placeholder="Enter number of subjects" min="1" max="10">
        <div class="error" id="subjectError">Please enter a number between 1 and 10</div>
      </div>

      <button id="setupSubjectsBtn">Setup Subjects</button>

      <!-- Dynamically generated inputs go here -->
      <div id="subjectInputs" class="subject-inputs"></div>

      <button id="generateReportBtn" style="display: none;">Generate Report</button>
    </div>

    <!-- REPORT SECTION -->
    <div id="reportSection" style="display: none;">
      <div id="reportDetails"></div>
      <div class="actions">
        <button id="newStudentBtn">Add New Student</button>
        <button id="resetBtn">Reset</button>
      </div>
    </div>
  </div>

  <script src="g.js"></script>
</body>
</html>
