<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Tracker</title>
    <link rel="stylesheet" href="4.css" />
    <style></style>
  </head>
  <body>
    <div class="container">
      <h1>Student Grade Tracker</h1>

      <div class="input-section" id="inputSection">
        <div class="input-group">
          <label for="studentName">Student Name</label>
          <input
            type="text"
            id="studentName"
            placeholder="Enter student's name"
          />
          <div class="error" id="nameError">Please enter a valid name</div>
        </div>

        <div class="input-group">
          <label for="numSubjects">Number of Subjects</label>
          <input
            type="number"
            id="numSubjects"
            min="1"
            max="10"
            placeholder="Enter number of subjects"
          />
          <div class="error" id="subjectError">
            Please enter a number between 1 and 10
          </div>
        </div>

        <button id="setupSubjectsBtn">Setup Subjects</button>

        <div class="subject-inputs" id="subjectInputs"></div>

        <button id="generateReportBtn" style="display: none">
          Generate Report
        </button>
      </div>

      <div class="report" id="reportSection">
        <h2>STUDENT REPORT</h2>
        <div class="report-content">
          <div id="reportDetails"></div>
        </div>

        <div class="actions">
          <button id="newStudentBtn">Add New Student</button>
          <button id="resetBtn">Reset</button>
        </div>
      </div>
    </div>

    <script src="4.js"></script>
  </body>
</html>
