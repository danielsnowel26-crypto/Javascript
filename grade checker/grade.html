<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Tracker</title>
    <link rel="stylesheet" href="grade.css" />
    <style></style>
  </head>
  <body>
    <div class="container">
      <h1>Student Grade Tracker</h1>

      <div class="Input-section" id="InputSection">
        <div class="Input-group">
          <label for="studentName">Student Name</label>
          <input
            type="text"
            id="studentName"
            placeholder="Enter student's name"
          />
          <div class="error" id="nameerror">Please Input A Valid Name</div>
        </div>

        <div class="input-group">
          <label for="numSubjects">Number of Subjects</label>
          <input
            type="number"
            id="numSubjects"
            min="1"
            max="12"
            placeholder="Enter number of subjects"
          />
          <div class="error" id="subjectsError">
            Please Input A Number Between 1 and 12
          </div>
        </div>

        <button id="setupSubjectBtn">Setup Subjects</button>

        <div class="subject-inputs" id="subjectInputs"></div>

        <button id="generateReportBtn" style="display: none">
          Generate Student's Report
        </button>
      </div>

      <div class="report" id="reportSection">
        <h2>Student Report</h2>
        <div class="report-content">
          <div id="reportDetails"></div>
        </div>

        <div class="actions">
          <button id="newstudentBtn">Add New Student</button>
          <button id="resetBtn">Reset</button>
        </div>
      </div>
    </div>

    <script src="grade.js"></script>
  </body>
</html>
